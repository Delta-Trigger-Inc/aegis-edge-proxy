name: Verify production proxy
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Protocol and policy tests
        run: |
          python3 -m venv /tmp/proxy-tests
          /tmp/proxy-tests/bin/pip install -r requirements.txt pytest==9.1.1
          /tmp/proxy-tests/bin/python -m pytest -q
      - name: Build pinned runtime
        run: docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -t aegis-proxy:test .
      - name: Real TLS and lifecycle tests without external network
        run: |
          docker run --rm --network none --entrypoint /usr/bin/python3 -v "$PWD/tests:/tests:ro" aegis-proxy:test /tests/integration.py
          docker run --rm --network none --entrypoint /usr/bin/python3 -v "$PWD/tests:/tests:ro" aegis-proxy:test /tests/runtime_security.py
